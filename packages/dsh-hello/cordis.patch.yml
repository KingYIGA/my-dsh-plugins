# dsh-hello —— bundle patch（插件挂载声明）
#
# DSH 启动时按 bundle 层栈叠加各插件的 patch，生成 profile 的配置树。
# 本文件把 dsh-hello 插件插入配置树：id 是树内唯一标识，name 是要加载的
# 包名（从 profile 的 node_modules 解析），config 会作为 apply(ctx, config)
# 的第二个参数传给插件。
- insert:
    - id: dsh-hello
      name: dsh-hello
      config:
        greeting: Hello from dsh-hello!
